
name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:

  # Stage 1 : Qualite du code
  pylint:
    name: Pylint - Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx pytest-cov pylint

      - name: Analyser la qualite du code
        run: pylint --fail-under=10 main.py test_main.py

  # Stage 2 : Tests unitaires
  run-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: pylint

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx pytest-cov pylint

      - name: Executer les tests et generer JUnit XML
        run: pytest -v --junitxml=report.xml

      - name: Sauvegarder le rapport JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-junit
          path: report.xml

  # Stage 2 : Calcul de la couverture
  calculate-coverage:
    name: Calculate Code Coverage
    runs-on: ubuntu-latest
    needs: pylint

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx pytest-cov

      - name: Calculer la couverture
        run: |
          pytest -v --cov=main --cov-report=term --cov-report=xml:coverage.xml --cov-report=html --cov-fail-under=90

      - name: Afficher la couverture dans le resume GitHub
        if: always()
        run: |
          echo "## Rapport de couverture" >> $GITHUB_STEP_SUMMARY
          coverage report >> $GITHUB_STEP_SUMMARY

      - name: Sauvegarder le rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-coverage
          path: |
            coverage.xml
            htmlcov/
