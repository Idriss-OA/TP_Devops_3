
name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest httpx pytest-cov pylint

      - name: Executer les tests
        run: pytest -v

      - name: Calculer la couverture
        run: pytest --cov=main --cov-report=term --cov-fail-under=90

      - name: Verifier la qualite du code
        run: pylint main.py test_main.py
